org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 项目路径含中文「品味地图」，跳过 AGP 的 ASCII 路径检查（本项目无 NDK/C++ 原生代码，安全）
android.overridePathCheck=true
# Kotlin 改为进程内编译，避免 Kotlin 编译守护进程在 Windows 上启动挂起（Kotlin 2.2 已知问题）
kotlin.compiler.execution.strategy=in-process
# 网络超时兜底：避免依赖下载连接不通时无限挂起（默认可长达数十分钟）
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=30000
# 本地代理（用户提供，端口 7877）：Gradle JVM 的依赖下载走此代理，绕过国内网络对 google/github 的封锁
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7877
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7877
